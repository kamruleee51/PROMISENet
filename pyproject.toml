[project]
name = "promisenet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "albumentations==2.0.5",
    "einops>=0.8.2",
    "monai>=1.5.2",
    "numpy>=2.5.3",
    "opencv-python==4.10.0.84",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.7",
    "torchvision>=0.22",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
